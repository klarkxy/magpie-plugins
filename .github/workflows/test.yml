name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: yetone/magpie
          ref: 396a6a3d4fc44b736ca34e303138ad8882ca11e8
          path: .ci/magpie
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: .ci/magpie/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Build isolated Magpie
        working-directory: .ci/magpie
        run: go build -tags nogui -o ../magpie-bin .
      - name: Test all packages including native host and gateway
        env:
          MAGPIE_EXE: ${{ github.workspace }}/.ci/magpie-bin
          MAGPIE_HOST: ${{ github.workspace }}/.ci/magpie/internal/plugin/host.js
        run: |
          export MAGPIE_BUN="$(command -v bun)"
          npm test
